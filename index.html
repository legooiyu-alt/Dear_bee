<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="UrEMLPAwmZjrn3exq7mf0_v7soJ_HZTBzS_khvWUKG8" />
    <meta name="description" content="گالری عکس‌های هدی - Dear Bee">
    <meta name="keywords" content="هدی, Dear Bee, گالری عکس">
    <meta name="author" content="هدی">
    <meta name="robots" content="index, follow">
    <title>Dear Bee 🐝 | گالری عکس هدی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* افکت ماتریکس */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 30px); }
        }

        h1 {
            font-size: 2.5em;
            color: #00ff41;
            text-shadow: 
                0 0 10px #00ff41,
                0 0 20px #00ff41,
                0 0 40px #00ff41;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-align: center;
            animation: flicker 3s infinite alternate;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            95% { opacity: 1; }
            96% { opacity: 0.8; }
            97% { opacity: 1; }
            98% { opacity: 0.9; }
            99% { opacity: 1; }
        }

        .subtitle {
            color: #00aa2a;
            font-size: 1em;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 40px;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
            text-align: center;
            max-width: 400px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1000px;
            width: 100%;
        }

        .card {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid #00ff41;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 
                0 0 10px rgba(0, 255, 65, 0.3),
                inset 0 0 20px rgba(0, 255, 65, 0.1);
            transition: all 0.4s;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff41, transparent);
            animation: scanline 3s linear infinite;
        }

        @keyframes scanline {
            0% { top: 0; left: -100%; }
            50% { top: 100%; left: -100%; }
            51% { top: 100%; left: 100%; }
            100% { top: 0; left: 100%; }
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 0 20px rgba(0, 255, 65, 0.6),
                0 0 40px rgba(0, 255, 65, 0.3),
                inset 0 0 30px rgba(0, 255, 65, 0.2);
            border-color: #00ff41;
        }

        .card img {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            filter: hue-rotate(90deg) contrast(1.1);
            transition: filter 0.4s;
        }

  .card:hover img {
    filter: contrast(1.2) brightness(1.1);
}

        .card p {
            padding: 15px;
            margin: 0;
            color: #00ff41;
            font-size: 0.95em;
            letter-spacing: 1px;
            text-align: center;
            background: rgba(0, 255, 65, 0.05);
            border-top: 1px solid rgba(0, 255, 65, 0.3);
        }

        /* نوار وضعیت پایین */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid #00ff41;
            color: #00ff41;
            font-size: 0.75em;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }

        .status-bar span {
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <h1>🐝 Dear Bee 🐝</h1>
    <p class="subtitle">a piece of bee's life</p>

    <div class="gallery">
        <div class="card">
            <img src="bee.jpg" alt="عکس اول">
            <p>its not what you believe it to be</p>
        </div>
    </div>

    <div class="status-bar">
        <span>● SYSTEM ACTIVE</span>
        <span>Dear_Bee v1.0</span>
        <span id="clock">--:--:--</span>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-GB');
            document.getElementById('clock').textContent = time;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
